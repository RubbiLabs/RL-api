name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rubbi
          POSTGRES_PASSWORD: rubbi
          POSTGRES_DB: rubbi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rubbi -d rubbi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rubbi:rubbi@localhost:5432/rubbi_test
      TEST_DATABASE_URL: postgresql://rubbi:rubbi@localhost:5432/rubbi_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply migrations to the test database
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
