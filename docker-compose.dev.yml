services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rubbi-api-dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rubbi:rubbi@db:5432/rubbi
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 3000
    command: >-
      sh -c "bun install --no-progress &&
             bunx prisma generate &&
             bunx prisma db push &&
             bun run --watch src/server.ts"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rubbi-postgres-dev
    environment:
      POSTGRES_USER: rubbi
      POSTGRES_PASSWORD: rubbi
      POSTGRES_DB: rubbi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubbi -d rubbi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rubbi-redis-dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  api_node_modules:
  postgres_data:
  redis_data:
